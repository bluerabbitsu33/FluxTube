name: Flutter windows CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: 3.47.1   # 改成真实存在的版本

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装项目依赖
        run: flutter pub get


  build-windows:
    needs: test-lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Flutter Windows
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖安装
        run: flutter pub get

      - name: 编译 Windows 桌面安装包
        run: flutter build windows --release

      - name: 压缩 Windows 产物
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Windows-Release.zip

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release-Zip
          path: Windows-Release.zip
