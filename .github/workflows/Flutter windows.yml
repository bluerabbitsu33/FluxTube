name: Build Windows MSIX

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create MSIX package
        run: dart run msix:create

      - name: Find MSIX file
        id: find_msix
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Filter *.msix -Recurse | Select-Object -First 1
          if ($msix) {
            echo "msix_path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
            echo "Found: $($msix.FullName)"
          } else {
            echo "MSIX not found"
            exit 1
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: ${{ steps.find_msix.outputs.msix_path }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_msix.outputs.msix_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
